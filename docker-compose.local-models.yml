#
# JARVIS local model services for the desktop app.
#
# Normal users should not need to run this by hand. The desktop backend exposes
# /api/runtime/docker/* endpoints and scripts/jarvis-docker-models.ps1 wraps the
# same compose file for setup and troubleshooting.
#
# Resource policy:
#   - No mem_limit, cpus, or hard reservations are set. Local inference can use
#     burst CPU/RAM/GPU headroom while Docker Desktop/WSL can reclaim idle
#     memory when containers are stopped or quiet.
#   - Services bind to 127.0.0.1 only. They are private to the local desktop.
#
name: jarvis-local-models

services:
  jarvis-llamacpp:
    image: ${JARVIS_LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    container_name: jarvis-llamacpp
    restart: unless-stopped
    profiles: ["llamacpp", "models"]
    ports:
      - "127.0.0.1:${JARVIS_LLAMA_CPP_PORT:-8080}:8080"
    volumes:
      - "${JARVIS_MODELS_DIR:-./models}:/models:ro"
    command:
      - "--model"
      - "/models/${JARVIS_LLAMA_CPP_MODEL:-model.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "${JARVIS_LLAMA_CPP_CTX:-32768}"
      - "--n-gpu-layers"
      - "${JARVIS_LLAMA_CPP_GPU_LAYERS:-999}"
      - "--threads"
      - "${JARVIS_LLAMA_CPP_THREADS:-8}"
      - "--threads-batch"
      - "${JARVIS_LLAMA_CPP_THREADS_BATCH:-8}"
      - "--batch-size"
      - "${JARVIS_LLAMA_CPP_BATCH_SIZE:-1024}"

  jarvis-vllm:
    image: ${JARVIS_VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: jarvis-vllm
    restart: unless-stopped
    profiles: ["vllm", "models"]
    ports:
      - "127.0.0.1:${JARVIS_VLLM_PORT:-8000}:8000"
    volumes:
      - "${JARVIS_MODELS_DIR:-./models}:/models:ro"
      - "${JARVIS_HF_CACHE_DIR:-./.cache/huggingface}:/root/.cache/huggingface"
    environment:
      - HF_HOME=/root/.cache/huggingface
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--model"
      - "${JARVIS_VLLM_MODEL:-/models}"
      - "--gpu-memory-utilization"
      - "${JARVIS_VLLM_GPU_MEMORY_UTILIZATION:-0.90}"
      - "--max-model-len"
      - "${JARVIS_VLLM_MAX_MODEL_LEN:-32768}"

  jarvis-ollama:
    image: ${JARVIS_OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: jarvis-ollama
    restart: unless-stopped
    profiles: ["ollama", "models"]
    ports:
      - "127.0.0.1:${JARVIS_OLLAMA_PORT:-11434}:11434"
    volumes:
      - "jarvis_ollama:/root/.ollama"

  jarvis-voice:
    build:
      context: ./docker/voice-runtime
    image: jarvis-voice-runtime:local
    container_name: jarvis-voice
    restart: unless-stopped
    profiles: ["voice", "models"]
    ports:
      - "127.0.0.1:${JARVIS_VOICE_PORT:-9010}:9010"
    volumes:
      - "${JARVIS_MODELS_DIR:-./models}:/models"
      - "${JARVIS_VOICE_ASSETS_DIR:-./assets}:/voices:ro"
    environment:
      - JARVIS_STT_MODEL=${JARVIS_STT_MODEL:-base}
      - JARVIS_STT_DEVICE=${JARVIS_STT_DEVICE:-auto}
      - JARVIS_STT_COMPUTE_TYPE=${JARVIS_STT_COMPUTE_TYPE:-int8}
      - JARVIS_STT_LANGUAGE=${JARVIS_STT_LANGUAGE:-en}
      - JARVIS_TTS_ENGINE=${JARVIS_TTS_ENGINE:-kokoro}
      - JARVIS_TTS_VOICE=${JARVIS_TTS_VOICE:-am_adam}
      - JARVIS_SYSTEM_TTS_VOICE=${JARVIS_SYSTEM_TTS_VOICE:-en}

volumes:
  jarvis_ollama:
